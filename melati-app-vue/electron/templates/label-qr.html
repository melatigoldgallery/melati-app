<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --page-width: {{pageWidthMm}}mm;
        --page-height: {{pageHeightMm}}mm;
        --page-padding-x: {{pagePaddingX}}mm;
        --page-padding-y: {{pagePaddingY}}mm;
        --label-width: {{labelWidthMm}}mm;
        --label-height: {{labelHeightMm}}mm;
        --gap-width: {{gapMm}}mm;
        --qr-size: 10.5mm;
        --content-shift-x: 0mm;
      }

      @page {
        size: var(--page-width) var(--page-height);
        margin: 0;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: var(--page-width);
        height: var(--page-height);
        overflow: hidden;
      }
      .sheet {
        width: var(--page-width);
        height: var(--page-height);
        position: relative;
        box-sizing: border-box;
        overflow: hidden;
        font-family: Tahoma, Arial, sans-serif;
        text-rendering: geometricPrecision;
        background: #fff;
      }
      .label {
        width: var(--label-width);
        height: var(--label-height);
        position: relative;
        box-sizing: border-box;
        overflow: hidden;
        background: #fff;
      }
      .label.left {
        position: absolute;
        left: var(--page-padding-x);
        top: var(--page-padding-y);
      }
      .label.right {
        position: absolute;
        left: calc(var(--page-padding-x) + var(--label-width) + var(--gap-width));
        top: var(--page-padding-y);
        --content-shift-x: 1mm;
        --kode-shift-x: 2mm;
      }
      .label-inner {
        width: 100%;
        height: 100%;
        position: relative;
        box-sizing: border-box;
      }
      .qr {
        position: absolute;
        top: 0mm;
        left: calc(2mm + var(--content-shift-x));
        width: var(--qr-size);
        height: var(--qr-size);
        object-fit: contain;
      }
      .kode {
        position: absolute;
        top: 11mm;
        left: calc(2mm + var(--content-shift-x));
        right: 2mm;
        font-weight: 700;
        font-size: 9px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }
      .nama {
        position: absolute;
        top: 14.5mm;
        left: calc(2mm + var(--content-shift-x));
        right: 2mm;
        font-weight: 700;
        font-size: 9px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }
      .berat {
        position: absolute;
        top: 18mm;
        left: calc(2mm + var(--content-shift-x));
        right: 2mm;
        font-weight: 700;
        font-size: 8px;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }
      .mlt3 {
        position: absolute;
        top: 5mm;
        left: calc(12mm + var(--content-shift-x) + var(--kode-shift-x));
        right: 1mm;
        font-weight: 700;
        font-size: 9px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }
      .kadar {
        position: absolute;
        right: 2mm;
        bottom: 2mm;
        font-weight: 700;
        font-size: 7px;
        line-height: 1;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    {{#each rows}}
    <div class="sheet">
      <div class="label left">
        <div class="label-inner">
          <img class="qr" src="{{this.left.qrDataUrl}}" alt="QR" />
          <div class="mlt3">MLT3</div>
          <div class="kode">{{this.left.kode}}</div>
          <div class="nama">{{this.left.nama}}</div>
          <div class="berat">{{this.left.berat}} gr</div>
          {{#if this.left.kadar}}
          <div class="kadar">{{this.left.kadar}}</div>
          {{/if}}
        </div>
      </div>
      <div class="label right">
        <div class="label-inner">
          <img class="qr" src="{{this.right.qrDataUrl}}" alt="QR" />
          <div class="mlt3">MLT3</div>
          <div class="kode">{{this.right.kode}}</div>
          <div class="nama">{{this.right.nama}}</div>
          <div class="berat">{{this.right.berat}} gr</div>
          {{#if this.right.kadar}}
          <div class="kadar">{{this.right.kadar}}</div>
          {{/if}}
        </div>
      </div>
    </div>
    {{/each}}
  </body>
</html>
