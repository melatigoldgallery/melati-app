<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- jQuery first -->
    <script src="js/jquery-3.6.3.min.js"></script>
    <!-- Bootstrap CSS and JS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Browser Image Compression -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/pages/absensi-modern.css" />
    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <!-- Custom CSS untuk WhatsApp button dan Table Container -->
    <style>
      .whatsapp-contacted {
        background-color: #d4edda !important;
        border-left: 4px solid #28a745 !important;
      }

      .whatsapp-status {
        font-size: 0.75em;
        margin-top: 2px;
      }

      .whatsapp-btn.contacted {
        background-color: #6c757d !important;
        border-color: #6c757d !important;
      }
      .whatsapp-btn {
        font-size: 0.7rem;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        background-color: #25d366;
        border-color: #25d366;
        color: black;
        text-decoration: none;
        display: inline-block;
        transition: all 0.2s ease;
      }

      .whatsapp-btn:hover {
        background-color: #128c7e;
        border-color: #128c7e;
        color: white;
        transform: translateY(-1px);
      }

      .whatsapp-btn:active {
        transform: translateY(0);
      }

      .status-cell {
        min-width: 180px;
      }

      /* Status Pembayaran Badge */
      .status-pembayaran-lunas {
        background-color: #28a745;
        color: white;
      }
      .status-pembayaran-belum-lunas {
        background-color: #ffc107;
        color: #212529;
      }
      .status-pembayaran-free {
        background-color: #17a2b8;
        color: white;
      }
      .status-pembayaran-custom {
        background-color: #6f42c1;
        color: white;
      }

      /* CSS Table Container */
      .main-content {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
      }

      #dataServisTable {
        min-width: 2000px;
        margin-bottom: 0;
      }

      /* Common columns (1-6) untuk SERVIS dan CUSTOM */
      #dataServisTable th:nth-child(1),
      #dataServisTable td:nth-child(1) {
        width: 40px;
        min-width: 40px;
        text-align: center;
      }

      #dataServisTable th:nth-child(2),
      #dataServisTable td:nth-child(2) {
        width: 100px;
        min-width: 100px;
      }

      #dataServisTable th:nth-child(3),
      #dataServisTable td:nth-child(3) {
        width: 100px;
        min-width: 100px;
      }

      #dataServisTable th:nth-child(4),
      #dataServisTable td:nth-child(4) {
        width: 140px;
        min-width: 140px;
      }

      #dataServisTable th:nth-child(5),
      #dataServisTable td:nth-child(5) {
        width: 130px;
        min-width: 130px;
        white-space: normal !important;
        word-break: break-word;
      }

      #dataServisTable th:nth-child(6),
      #dataServisTable td:nth-child(6) {
        width: 275px;
        min-width: 275px;
      }

      /* === SERVIS (19 kolom) === */
      /* Kolom 7: Berat */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(7) {
        width: 70px;
        min-width: 70px;
      }
      /* Kolom 8: Kadar */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(8) {
        width: 70px;
        min-width: 70px;
      }
      /* Kolom 9: Jenis Servis (BARU) */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(9) {
        width: 120px;
        min-width: 120px;
      }
      /* Kolom 10: Rincian Servis */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(10) {
        width: 250px;
        min-width: 250px;
      }
      /* Kolom 11: Pembayaran */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(11) {
        width: 120px;
        min-width: 120px;
        text-align: center;
      }
      /* Kolom 12: Ongkos */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(12) {
        width: 130px;
        min-width: 130px;
        text-align: center;
      }
      /* Kolom 13: Status Servis */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(13) {
        width: 140px;
        min-width: 140px;
        text-align: center;
      }
      /* Kolom 14: Status Pengambilan */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(14) {
        width: 140px;
        min-width: 140px;
        text-align: center;
      }
      /* Kolom 15: WhatsApp */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(15) {
        width: 140px;
        min-width: 140px;
      }
      /* Kolom 16: Handle Pengambilan */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(16) {
        width: 150px;
        min-width: 150px;
      }
      /* Kolom 17: Waktu Pengambilan */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(17) {
        width: 150px;
        min-width: 150px;
      }
      /* Kolom 18: Bukti Pengambilan */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(18) {
        width: 150px;
        min-width: 150px;
      }
      /* Kolom 19: Aksi */
      #dataServisTable tr[data-jenis='servis'] td:nth-child(19) {
        width: 80px;
        min-width: 80px;
        text-align: center;
      }

      /* === CUSTOM (18 kolom) === */
      #dataServisTable tr[data-jenis='custom'] td:nth-child(7) {
        width: 70px;
        min-width: 70px;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(8) {
        width: 70px;
        min-width: 70px;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(9) {
        width: 70px;
        min-width: 70px;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(10) {
        width: 90px;
        min-width: 90px;
        text-align: center;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(11) {
        width: 275px;
        min-width: 275px;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(12) {
        width: 120px;
        min-width: 120px;
        text-align: center;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(13) {
        width: 120px;
        min-width: 120px;
        text-align: center;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(14) {
        width: 130px;
        min-width: 130px;
        text-align: center;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(15) {
        width: 140px;
        min-width: 140px;
        text-align: center;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(16) {
        width: 140px;
        min-width: 140px;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(17) {
        width: 150px;
        min-width: 150px;
      }
      #dataServisTable tr[data-jenis='custom'] td:nth-child(18) {
        width: 80px;
        min-width: 80px;
        text-align: center;
      }

      #dataServisTable thead th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 10;
        border-bottom: 2px solid #dee2e6;
      }

      @media (max-width: 768px) {
        .table-container {
          margin: 0 -15px;
          border-radius: 0;
        }

        #dataServisTable {
          font-size: 0.875rem;
        }
      }

      /* Skeleton Loading */
      .skeleton-loading {
        height: 20px;
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: loading 1.5s ease-in-out infinite;
        border-radius: 4px;
      }

      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .skeleton-row td {
        padding: 1rem 0.5rem;
      }

      /* Pagination Styles */
      .pagination-wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        border-top: 1px solid #dee2e6;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .pagination-info {
        color: #6c757d;
        font-size: 0.9rem;
      }

      .pagination-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .pagination-controls button {
        min-width: 36px;
      }

      .items-per-page {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .items-per-page select {
        width: 60px;
        padding: 0.25rem 0.5rem;
        font-size: 0.9rem;
      }

      #pageNumbers {
        display: flex;
        gap: 0.25rem;
      }

      @media (max-width: 768px) {
        .pagination-wrapper {
          flex-direction: column;
          align-items: stretch;
        }

        .pagination-controls {
          justify-content: center;
        }

        .items-per-page {
          justify-content: center;
        }
      }
    </style>
    <title>Data Servis - Melati Gold Shop</title>
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="text-center p-3">
          <div class="spinner-border spinner-border-sm text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Top Navigation -->
        <header class="top-nav">
          <div class="menu-toggle d-md-flex d-none">
            <i class="fa-solid fa-minimize"></i>
          </div>
          <div class="hamburger d-md-none d-flex">
            <i class="fas fa-bars"></i>
          </div>
          <div class="nav-right">
            <div class="date-time">
              <div class="current-date" id="current-date"></div>
              <div class="current-time" id="current-time"></div>
            </div>
            <div class="user-profile dropdown">
              <div class="profile-img" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="user-avatar">M</span>
              </div>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <button class="dropdown-item" id="logoutBtn" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">
          <div class="page-header">
            <h1>Data Servis</h1>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item"><a href="#">Servis</a></li>
                <li class="breadcrumb-item active" aria-current="page">Data Servis</li>
              </ol>
            </nav>
          </div>

          <div class="content-wrapper">
            <!-- Alert Container -->
            <div id="alertContainer" class="mb-3" style="display: none"></div>

            <!-- Filter Section -->
            <div class="card mb-4">
              <div class="card-header">
                <h2>
                  <i class="fas fa-filter"></i>
                  Filter Data Servis
                </h2>
              </div>
              <div class="card-body">
                <div class="row align-items-end mb-3">
                  <div class="col-md-2">
                    <label for="monthSelector" class="form-label">Bulan</label>
                    <select id="monthSelector" class="form-select">
                      <option value="1">Januari</option>
                      <option value="2">Februari</option>
                      <option value="3">Maret</option>
                      <option value="4">April</option>
                      <option value="5">Mei</option>
                      <option value="6">Juni</option>
                      <option value="7">Juli</option>
                      <option value="8">Agustus</option>
                      <option value="9">September</option>
                      <option value="10">Oktober</option>
                      <option value="11">November</option>
                      <option value="12">Desember</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <label for="yearSelector" class="form-label">Tahun</label>
                    <select id="yearSelector" class="form-select">
                      <!-- Will be populated with JavaScript -->
                    </select>
                  </div>
                  <div class="col-md-2">
                    <label for="jenisDataFilter" class="form-label">Jenis Data</label>
                    <select id="jenisDataFilter" class="form-select">
                      <option value="servis">Servis</option>
                      <option value="custom">Custom</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <label for="statusServisFilter" class="form-label">Status Pengerjaan</label>
                    <select id="statusServisFilter" class="form-select">
                      <option value="Belum Selesai">Belum Selesai</option>
                      <option value="Sudah Selesai">Sudah Selesai</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <label for="statusPengambilanFilter" class="form-label"
                      >Status Pengambilan</label
                    >
                    <select id="statusPengambilanFilter" class="form-select">
                      <option value="Belum Diambil">Belum Diambil</option>
                      <option value="Sudah Diambil">Sudah Diambil</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <button id="tampilkanBtn" class="btn btn-primary w-100">
                      <i class="fas fa-search me-2"></i>
                      Tampilkan
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Data Table -->
            <div class="card" id="tableContainer" style="display: none">
              <div class="card-header">
                <h2>
                  <i class="fas fa-list"></i>
                  <span id="tableTitle">Data Servis</span>
                  <span id="cacheIndicator" class="badge bg-info ms-2" style="display: none">
                    <i class="fas fa-database me-1"></i>
                    Cache
                  </span>
                </h2>
              </div>
              <!-- Search input section -->
              <div class="card-body border-bottom">
                <div class="row">
                  <div class="col-md-2">
                    <label for="searchInputTable" class="form-label">Pencarian</label>
                    <input
                      type="text"
                      class="form-control"
                      id="searchInputTable"
                      placeholder="Cari nama, HP..."
                    />
                  </div>
                </div>
              </div>
              <div class="card-body">
                <div class="table-container">
                  <table class="table table-hover" id="dataServisTable">
                    <thead id="tableHeaders">
                      <!-- Dynamic headers will be inserted here -->
                    </thead>
                    <tbody id="dataServisList"></tbody>
                  </table>
                </div>
                <!-- Pagination -->
                <div class="pagination-wrapper">
                  <div class="pagination-info">
                    <span id="paginationInfo">Menampilkan 0 data</span>
                  </div>
                  <div class="pagination-controls" id="paginationControls" style="display: none">
                    <button
                      class="btn btn-sm btn-outline-primary"
                      id="prevPageBtn"
                      onclick="prevPage()"
                    >
                      <i class="fas fa-chevron-left"></i>
                    </button>
                    <div id="pageNumbers"></div>
                    <button
                      class="btn btn-sm btn-outline-primary"
                      id="nextPageBtn"
                      onclick="nextPage()"
                    >
                      <i class="fas fa-chevron-right"></i>
                    </button>
                  </div>
                  <div class="items-per-page">
                    <label for="itemsPerPageSelect" class="mb-0">Tampilkan:</label>
                    <select
                      id="itemsPerPageSelect"
                      class="form-select form-select-sm"
                      onchange="changeItemsPerPage(this.value)"
                    >
                      <option value="10">10</option>
                      <option value="25" selected>25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- No Data Message -->
            <div id="noDataMessage" class="alert alert-info text-center" style="display: none">
              <i class="fas fa-info-circle me-2"></i>
              Tidak ada data servis untuk kriteria yang dipilih
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Update Status -->
    <div
      class="modal fade"
      id="updateStatusModal"
      tabindex="-1"
      aria-labelledby="updateStatusModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="updateStatusModalLabel">Update Status</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="updateStatusForm">
              <input type="hidden" id="updateServisId" />
              <div class="mb-3">
                <label for="statusServis" class="form-label">Status Servis</label>
                <select class="form-select" id="statusServis">
                  <option value="Belum Selesai">Belum Selesai</option>
                  <option value="Sudah Selesai">Sudah Selesai</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="statusPengambilan" class="form-label">Status Pengambilan</label>
                <select class="form-select" id="statusPengambilan">
                  <option value="Belum Diambil">Belum Diambil</option>
                  <option value="Sudah Diambil">Sudah Diambil</option>
                </select>
              </div>
              <!-- Form tambahan untuk pengambilan -->
              <div id="pengambilanForm" style="display: none">
                <div class="mb-3">
                  <label for="stafHandle" class="form-label">Staf Handle</label>
                  <input
                    type="text"
                    class="form-control"
                    id="stafHandle"
                    placeholder="Nama staf yang menangani"
                  />
                </div>
                <div class="mb-3">
                  <label for="waktuPengambilan" class="form-label">Waktu Pengambilan</label>
                  <input
                    type="datetime-local"
                    class="form-control"
                    id="waktuPengambilan"
                    readonly
                  />
                </div>
                <div class="mb-3">
                  <label for="buktiPengambilan" class="form-label">
                    Bukti Pengambilan (Foto)
                    <span class="text-danger">*</span>
                  </label>
                  <input
                    type="file"
                    class="form-control"
                    id="buktiPengambilan"
                    accept="image/jpeg,image/png,image/jpg"
                  />
                  <small class="text-muted"
                    >Format: JPG/PNG, Maks 10MB (akan dikompres otomatis ke 500KB)</small
                  >
                  <div id="imagePreview" class="mt-2" style="display: none">
                    <img
                      id="previewImg"
                      src=""
                      alt="Preview"
                      style="max-width: 200px; max-height: 200px; border-radius: 8px"
                    />
                    <button type="button" class="btn btn-sm btn-danger mt-2" id="removeImageBtn">
                      <i class="fas fa-times"></i>
                      Hapus
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="button" class="btn btn-primary" id="saveStatusBtn">
              <i class="fas fa-save me-2"></i>
              Simpan
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal View Photo -->
    <div
      class="modal fade"
      id="viewPhotoModal"
      tabindex="-1"
      aria-labelledby="viewPhotoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header py-2 bg-primary">
            <h5 class="modal-title" id="viewPhotoModalLabel">Bukti Pengambilan</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-center">
            <img
              id="modalPhotoImg"
              src=""
              alt="Bukti Pengambilan"
              style="max-width: 100%; height: auto; border-radius: 8px"
            />
          </div>
        </div>
      </div>
    </div>

    <script src="js/sidebar-loader.js"></script>
    <script type="module" src="js/melati.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/pages/data-servis.js"></script>
  </body>
</html>
